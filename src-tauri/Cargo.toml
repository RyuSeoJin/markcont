[package]
name = "markcont"
version = "1.0.1"
description = "마크다운 파일을 보기 좋게 보고 편집하는 뷰어"
edition = "2021"
license = "MIT"
authors = ["RyuSeoJin"]
repository = "https://github.com/RyuSeoJin/markcont"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
rfd = "0.15"
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

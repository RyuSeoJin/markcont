# PC 프로그램 코드 확인 (설치 파일은 만들지 않음)
# src-tauri 를 고쳐 main 에 올리면 Windows 에서 컴파일만 해 봅니다.
name: PC 프로그램 코드 확인

on:
  push:
    branches: [main]
    paths: ['src-tauri/**', '.github/workflows/check.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: 도구 설치
        run: npm install
      - name: 아이콘 만들기
        run: npm run icons
      - name: 컴파일 확인
        run: cargo check --manifest-path src-tauri/Cargo.toml

# PC 프로그램 만들기
# v1.0.0 처럼 v 로 시작하는 태그를 올리면 Windows · macOS · Linux 설치 파일을 만들어
# GitHub Releases 에 올립니다. Actions 탭에서 직접 실행할 수도 있습니다.
name: PC 프로그램 만들기

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            # MSI(WiX)는 한글 설명을 못 다뤄서 NSIS 설치 파일(-setup.exe)만 만듭니다
            args: '--bundles nsis'
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            # .rpm 은 만들지 않음 (내려받기 안내도 .AppImage · .deb 만)
            args: '--bundles appimage,deb'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 빌드 준비
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 도구 설치
        run: npm install

      - name: 아이콘 만들기
        run: npm run icons

      - name: 오픈소스 라이선스 목록 만들기
        shell: bash
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml
          PY="$(command -v python3 || command -v python)"
          "$PY" scripts/gen_notices.py

      # 업데이트 파일 서명 키: 저장소 Settings → Secrets and variables → Actions 에
      # TAURI_SIGNING_PRIVATE_KEY (개인 키 파일 내용) · TAURI_SIGNING_PRIVATE_KEY_PASSWORD 를 등록해 두어야 합니다
      - name: 업데이트 서명 키 확인
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::업데이트 서명 키(TAURI_SIGNING_PRIVATE_KEY)가 Secrets 에 없습니다"
            exit 1
          fi

      # app/docs/changelog.md 에서 이번 버전 단락("## 1.10.0 · 날짜" 아래)을 꺼내 Releases 설명에 넣음
      - name: 이번 버전의 바뀐 점 꺼내기
        id: notes
        shell: bash
        run: |
          V="$(node -p "require('./package.json').version")"
          {
            echo 'body<<NOTES_EOF'
            awk -v v="$V" '/^## /{p = ($2 == v)} p && !/^## /' app/docs/changelog.md
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 설치 파일 만들고 Releases 에 올리기
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'markcont v__VERSION__'
          # 업데이트 정보(latest.json)도 함께 올림: PC 프로그램이 이것을 읽고 새 버전을 알림
          includeUpdaterJson: true
          releaseBody: |
            ## 바뀐 점
            ${{ steps.notes.outputs.body }}

            ## 내려받기
            - **Windows**: 이름이 `-setup.exe` 로 끝나는 파일을 받아 실행하세요.
            - **macOS**: `.dmg` 를 받아 응용 프로그램 폴더로 옮기세요. 처음 열 때는 오른쪽 클릭 → 열기.
            - **Linux**: `.AppImage` 또는 `.deb` 를 받으세요.
            - **이미 설치돼 있다면**: 프로그램 안 **⋯ → 도움말 → 업데이트 확인**으로 바로 업데이트하거나, 설치 화면에서 **제거하지 않기**를 고르세요. 설정과 기록은 그대로 남습니다.
            - 코드 서명이 없어서 Windows **스마트 앱 컨트롤**이 켜진 PC에서는 설치가 막힐 수 있습니다. 그때는 설치 없이 [웹 앱](https://ryuseojin.github.io/markcont/)을 쓰세요.

            설치하면 `.md` 파일을 더블클릭해서 바로 열 수 있습니다.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # 서명(.sig) 파일은 내용이 이미 latest.json 안에 들어 있어서(PC 프로그램은 거기서 읽음),
  # 세 운영체제 빌드가 모두 끝나면 내려받기 목록에서 지웁니다. 하나라도 실패하면 건너뜁니다.
  tidy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 서명 파일(.sig) 지우기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release view "$TAG" --json assets --jq '.assets[].name | select(endswith(".sig"))' | while read -r NAME; do
            gh release delete-asset "$TAG" "$NAME" --yes
            echo "지움: $NAME"
          done
